spring:
  config:
    activate:
      on-profile: production
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      # Expire pooled upstream channels before a long-idle connection can go stale.
      httpclient:
        pool:
          max-idle-time: 30s
          max-life-time: 10m
          eviction-interval: 10s
      routes:
        - id: x-notification-realtime
          # Live updates over WebSocket; long-lived, so no rate limiter.
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/ws/**
        - id: x-bff
          uri: ${BFF_SERVICE_URL:http://localhost:8443}
          predicates:
            - Path=/api/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientRateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:50}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:100}
                redis-rate-limiter.requestedTokens: 1

x:
  gateway:
    rate-limit:
      enabled: true
