name: Build and deploy x-api-gateway
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github-x-sharedlib
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/checkout@v4
        with:
          repository: sieng-vathana/x-sharedlib
          path: x-sharedlib
      - run: mvn --batch-mode --no-transfer-progress -DskipTests install -f x-sharedlib/pom.xml
      - run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sieng-vathana/x-api-gateway:main
            ghcr.io/sieng-vathana/x-api-gateway:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, x-platform-deploy]
    steps:
      - name: Roll out image
        run: |
          sudo k3s kubectl -n x-platform create deployment x-api-gateway --image=ghcr.io/sieng-vathana/x-api-gateway:${{ github.sha }} --dry-run=client -o yaml | sudo k3s kubectl apply -f -
          sudo k3s kubectl -n x-platform expose deployment x-api-gateway --port=8080 --target-port=8080 --dry-run=client -o yaml | sudo k3s kubectl apply -f -
          sudo k3s kubectl -n x-platform set env deployment/x-api-gateway SERVER_PORT=8080 SPRING_PROFILES_ACTIVE=production BFF_SERVICE_URL=http://x-bff.x-platform.svc.cluster.local:8080 SPRING_DATA_REDIS_HOST=redis.x-platform.svc.cluster.local SPRING_DATA_REDIS_PORT=6379
          sudo k3s kubectl -n x-platform rollout status deployment/x-api-gateway --timeout=180s
